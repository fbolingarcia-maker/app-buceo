name: GitHub Pages (redirige a divingslot.com)

# La web y la app se publican en Cloudflare (divingslot.com) en cada push a main.
# La copia antigua de GitHub Pages (fbolingarcia-maker.github.io/app-buceo) ya no se compila:
# publica solo una página que reenvía a divingslot.com con la misma ruta (#/salida/…, #access_token=…),
# así los enlaces viejos siguen funcionando y no hay dos versiones de la app.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Página de redirección
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://divingslot.com/">
          <title>DivingSlot</title>
          <script>location.replace('https://divingslot.com/' + location.search + location.hash)</script>
          <meta http-equiv="refresh" content="0; url=https://divingslot.com/">
          </head><body><p>DivingSlot is now at <a href="https://divingslot.com/">divingslot.com</a>.</p></body></html>
          HTML
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
