<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b5e8a" />
  <meta name="robots" content="noindex" />
  <title>DivingSlot · En construcción · Under construction</title>
  <meta name="description" content="DivingSlot: reserva salidas de buceo en Filipinas. Muy pronto. · Book dive trips in the Philippines. Coming soon." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 20'><rect width='30' height='20' fill='%23d62828'/><polygon points='0,0 6,0 30,16 30,20 24,20 0,4' fill='white'/></svg>" />
  <style>
    :root { --bg: #f4f8fb; --card: #ffffff; --ink: #0f2a3a; --muted: #5d7282; --brand: #0b5e8a; --line: #dbe6ee; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1820; --card: #11232e; --ink: #e8f1f6; --muted: #9bb2c1; --brand: #4fb3e8; --line: #1f3a4a; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    }
    main {
      width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--line);
      border-radius: 18px; padding: 36px 28px; text-align: center;
    }
    .flag { width: 72px; height: 48px; border-radius: 6px; display: block; margin: 0 auto 18px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -0.5px; }
    .tag { margin: 4px 0 26px; color: var(--muted); }
    h2 { margin: 0 0 6px; font-size: 20px; color: var(--brand); }
    p { margin: 0; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
    .muted { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <svg class="flag" viewBox="0 0 30 20" aria-hidden="true">
      <rect width="30" height="20" fill="#d62828" />
      <polygon points="0,0 6,0 30,16 30,20 24,20 0,4" fill="#fff" />
    </svg>
    <h1>Get your slot and dive</h1>
    <p class="tag">Filipinas · Philippines</p>

    <h2 lang="es">En construcción</h2>
    <p lang="es">Estamos preparando la forma más fácil de reservar salidas de buceo en Filipinas. Muy pronto.</p>

    <hr />

    <h2 lang="en">Under construction</h2>
    <p lang="en">We're building the easiest way to book dive trips in the Philippines. Coming soon.</p>

    <hr />
    <p class="muted">© DivingSlot</p>
  </main>
</body>
</html>
